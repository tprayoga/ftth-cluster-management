services:
  # -------------------------------------------------------------------------
  # 1. FTTH NEXT.JS APPLICATION (FRONTEND & BACKEND)
  # -------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ftth_indotek_app
    restart: unless-stopped
    ports:
      # Port 3005 di Host VM dipetakan ke Port 3000 di dalam container (bebas konflik)
      - "3005:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://indotek_admin:IndotekSecure2026!@postgres:5432/ftth_db
      - NEXT_PUBLIC_APP_NAME=FTTH Cluster Management | PT Indotek Buana Karya
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ftth_isolated_network

  # -------------------------------------------------------------------------
  # 2. FTTH POSTGRESQL DATABASE
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ftth_indotek_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: indotek_admin
      POSTGRES_PASSWORD: IndotekSecure2026!
      POSTGRES_DB: ftth_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ftth_postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      # Port 5435 di Host VM (agar tidak bentrok jika VM sudah ada PostgreSQL di 5432)
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indotek_admin -d ftth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ftth_isolated_network

networks:
  ftth_isolated_network:
    name: ftth_isolated_network
    driver: bridge

volumes:
  ftth_postgres_data:
    name: ftth_indotek_postgres_data
